<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFC300">
<title>合拍 · 合租生活管家</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#ECEDEF;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;color:#222;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;border:0;background:none;padding:0;margin:0;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
:root{
  --y:#FFC300; --y2:#FFD84D; --y-soft:#FFF6D6; --ink:#222; --sub:#666; --muted:#999; --line:#EEE; --bg:#F5F5F5; --card:#FFF;
  --orange:#FF6A00; --green:#1FA36A; --red:#E5423C; --blue:#3A7BD5; --tag:#F3F4F6;
}
/* ---- stage: phone + console ---- */
.stage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;gap:28px;padding:28px 16px}
.device,.console{align-self:center}
.device{position:relative;width:402px;height:874px;background:#000;border-radius:56px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 2px #2a2a2a inset;flex:0 0 auto}
.device .screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--bg)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:24px;z-index:600}
.statusbar{position:absolute;top:0;left:0;right:0;height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 10px;font-size:15px;font-weight:600;z-index:600;pointer-events:none}
.statusbar .time{font-variant-numeric:tabular-nums}
.statusbar .right{display:flex;gap:6px;align-items:center}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.app .content{flex:1;overflow-y:auto;overflow-x:hidden;padding:64px 14px 96px;scrollbar-width:none}
.app .content::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px 22px;z-index:30}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);font-weight:500}
.tabbar button.on{color:var(--ink)}
.tabbar svg{width:24px;height:24px}
.tabbar button.on svg{filter:none}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#111;z-index:60;opacity:.85}

@media (max-width:899px){
  body{background:var(--bg)}
  .stage{padding:0;gap:0;display:block;min-height:auto}
  .device{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .device .screen{border-radius:0}
  .island,.homebar{display:none}
  .statusbar{display:none}
  .app .content{padding-top:12px}
  .console{display:none}
  .console.open{display:flex;position:fixed;inset:auto 0 0 0;width:100%;max-height:70vh;border-radius:16px 16px 0 0;z-index:500;overflow:auto}
  .console-fab{display:flex !important}
  .guide{width:auto;max-height:none;border-radius:0;margin:0}
}
.console-fab{display:none;position:fixed;right:14px;bottom:100px;width:44px;height:44px;border-radius:22px;background:#222;color:#fff;align-items:center;justify-content:center;z-index:400;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:18px}

/* ---- console ---- */
.console{width:300px;background:#1D1F23;color:#DDD;border-radius:16px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;font-size:13px;flex:0 0 auto;max-height:874px;overflow:auto;scrollbar-width:thin}
.console h3{margin:0 0 2px;font-size:14px;color:#fff;letter-spacing:.04em}
.console .hint{color:#8a8f98;font-size:12px;margin:0 0 6px}
.console .grp{border-top:1px solid #2c2f35;padding-top:10px}
.console .grp b{display:block;font-size:11px;color:#9aa0a8;letter-spacing:.12em;margin-bottom:8px;font-weight:600}
.console .row{display:flex;flex-wrap:wrap;gap:6px}
.console button{background:#2A2D33;color:#EEE;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.2;text-align:left}
.console button:hover{background:#363a42}
.console button.y{background:var(--y);color:#111;font-weight:600}
.console button.who{padding:6px 10px}
.console button.who.on{background:var(--y);color:#111}
.console .kv{display:flex;justify-content:space-between;color:#9aa0a8}
.console .kv span:last-child{color:#fff;font-variant-numeric:tabular-nums}

/* ---- app ui ---- */
.hdr{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.hdr h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.01em}
.hdr .sub{font-size:12px;color:var(--sub);margin-top:2px}
.avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#111;flex:0 0 auto}
.avatar.sm{width:26px;height:26px;font-size:11px}
.avatar.lg{width:52px;height:52px;font-size:20px}
.me-btn{display:flex;align-items:center;gap:8px;background:#fff;border-radius:20px;padding:4px 10px 4px 4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.me-btn .nm{font-size:13px;font-weight:600}
.me-btn .chev{color:var(--muted);font-size:11px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card.y{background:linear-gradient(160deg,#FFD84D,#FFC300);color:#111}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.card h2 .more{font-size:12px;color:var(--sub);font-weight:400}
.card.y h2 .more{color:rgba(0,0,0,.6)}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.big small{font-size:14px;font-weight:600;margin-right:2px}
.mono,.num{font-variant-numeric:tabular-nums}
.money{color:var(--orange);font-weight:700;font-variant-numeric:tabular-nums}
.money.in{color:var(--green)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.t1{font-size:15px;font-weight:600}
.t2{font-size:12.5px;color:var(--sub)}
.t3{font-size:12px;color:var(--muted)}
.list>*{padding:11px 0;border-bottom:1px solid var(--line)}
.list>*:last-child{border-bottom:0;padding-bottom:0}
.list>*:first-child{padding-top:0}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--tag);color:var(--sub);white-space:nowrap}
.pill.y{background:var(--y-soft);color:#8a6100}
.pill.g{background:#E4F5EC;color:var(--green)}
.pill.r{background:#FDE8E7;color:var(--red)}
.pill.o{background:#FFEEDD;color:var(--orange)}
.pill.b{background:#E8F0FC;color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--y);color:#111;font-weight:700;border-radius:10px;padding:11px 16px;font-size:15px;width:100%}
.btn.sm{padding:7px 12px;font-size:13px;width:auto;border-radius:8px}
.btn{white-space:nowrap}
.btn.ghost{background:#fff;border:1px solid #DDD;color:var(--ink);font-weight:600}
.btn.dark{background:#222;color:#fff}
.btn.line{background:var(--y-soft);color:#7a5600}
.btn:disabled{opacity:.45}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row .btn{flex:1}
.toggle{width:50px;height:30px;border-radius:15px;background:#DDD;position:relative;transition:.2s;flex:0 0 auto}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:var(--green)}
.toggle.on::after{left:23px}
.sec-title{font-size:13px;color:var(--sub);margin:16px 2px 8px;font-weight:600;letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:12px;padding:12px}
.tile .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--sub)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0}
.detail{background:#FAFAFA;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px}
.detail .ln{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1px 10px;padding:4px 0;border-bottom:1px dashed #E8E8E8}
.detail .ln span:first-child{flex:1 1 auto}
.detail .ln span:last-child{margin-left:auto;text-align:right}
.detail .ln:last-child{border-bottom:0}
.detail .ln.total{font-weight:700}
.bar{height:8px;border-radius:4px;background:#F0F0F0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--y);border-radius:4px}
.thresh{display:flex;gap:6px;align-items:flex-end;height:80px;padding:6px 4px 0}
.thresh .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--sub)}
.thresh .c i{display:block;width:100%;max-width:38px;background:var(--y);border-radius:6px 6px 2px 2px}
.thresh .c i.lo{background:#FFE9A3}
.link{color:var(--blue);font-size:13px;font-weight:600}
.notice-dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;margin-left:4px;vertical-align:middle}
.tabs{display:flex;background:#fff;border-radius:10px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--sub)}
.tabs button.on{background:var(--y);color:#111}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #DDD;border-radius:8px;padding:6px 10px;font-size:13px;background:#fff}
.chip.on{border-color:var(--y);background:var(--y-soft);font-weight:600}
.opt{border:1.5px solid #E5E5E5;border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;display:flex;gap:10px;align-items:flex-start}
.opt.on{border-color:#111;background:#FFFBEA}
.opt .k{width:24px;height:24px;border-radius:50%;background:var(--tag);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto;margin-top:1px}
.opt.on .k{background:#111;color:var(--y)}
.opt .why{font-size:12px;color:#8a6100;margin-top:4px}
.opt .tally{font-size:11.5px;color:var(--muted);margin-top:4px}
.q-num{font-size:12px;color:var(--muted);letter-spacing:.1em;font-weight:600}
.q-title{font-size:18px;font-weight:700;margin:4px 0 14px;line-height:1.35}
.progress{height:4px;background:#EEE;border-radius:2px;margin:6px 0 16px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--y)}
.input{width:100%;border:1px solid #DDD;border-radius:10px;padding:11px 12px;background:#fff;outline:none}
.input:focus{border-color:var(--y)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid #DDD;border-radius:8px;padding:7px 12px;font-size:13px;background:#fff}
.seg button.on{border-color:#111;background:#111;color:var(--y);font-weight:600}
.ranking .rk{width:22px;text-align:center;font-weight:800;color:var(--muted)}
.ranking .rk.top{color:var(--orange)}
.member-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.member-row:last-child{border-bottom:0}
.changelog{font-size:11.5px;color:var(--muted);text-align:center;margin:18px 0 6px}
.changelog b{color:var(--sub);font-weight:600}

/* ---- sheet / modal ---- */
.sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;animation:fade .18s}
.sheet{background:#F7F7F7;width:100%;max-height:92%;border-radius:22px 22px 0 0;padding:10px 16px 34px;overflow-y:auto;animation:up .22s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:#D8D8D8;margin:2px auto 12px}
.sheet h2{font-size:19px;margin:0 0 4px;font-weight:700}
.sheet .sub{color:var(--sub);font-size:13px;margin-bottom:14px}
.sheet.full{max-height:100%;height:100%;border-radius:0;padding-top:64px}
@media (max-width:899px){.sheet.full{padding-top:16px}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.close-x{position:absolute;right:14px;top:10px;width:30px;height:30px;border-radius:50%;background:#EEE;display:flex;align-items:center;justify-content:center;color:#555;font-size:16px}

/* ---- push notification ---- */
.push{position:absolute;top:62px;left:12px;right:12px;background:rgba(250,250,250,.96);backdrop-filter:blur(20px);border-radius:20px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:300;animation:drop .35s cubic-bezier(.2,.8,.2,1)}
@media (max-width:899px){.push{top:10px}}
@keyframes drop{from{transform:translateY(-80px);opacity:0}to{transform:none;opacity:1}}
.push .top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.push .ic{width:20px;height:20px;border-radius:5px;background:var(--y);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#111}
.push .ttl{font-weight:700;font-size:14px;margin-top:4px}
.push .body{font-size:13.5px;color:#333;margin-top:2px}
.push .acts{display:flex;gap:8px;margin-top:10px}
.push .acts button{flex:1;background:#fff;border:1px solid #DDD;border-radius:9px;padding:8px;font-size:13px;font-weight:600}
.push .acts button.pri{background:var(--y);border-color:var(--y)}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(20,20,20,.9);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:350;white-space:nowrap;animation:fade .2s}
.note{background:#FFF9E6;border:1px solid #FFE9A3;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#6b4d00;margin-bottom:12px}
.note.b{background:#EEF4FF;border-color:#CFE0FF;color:#2a4d8a}
.strike{text-decoration:line-through;color:var(--muted)}
.settle-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.settle-tbl td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.settle-tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.settle-tbl tr.total td{border-bottom:0;font-weight:800;font-size:16px;padding-top:12px}
.dim{opacity:.55}
.week-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.area{background:#fff;border-radius:12px;padding:10px 8px;text-align:center;border:1.5px solid transparent}
.area.mine{border-color:var(--y);background:var(--y-soft)}
.area .an{font-size:13px;font-weight:700}
.area .who{font-size:12px;color:var(--sub);margin-top:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.area .swap{font-size:11px;color:var(--orange)}
.photo{height:64px;border-radius:10px;margin-bottom:8px;position:relative;overflow:hidden;background:#F0EAD6}
.photo::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(120,90,40,var(--m)) 0 6px,transparent 6px 14px)}
.hist{font-size:12.5px;color:var(--sub);padding:6px 0;border-bottom:1px dashed var(--line)}
.hist:last-child{border-bottom:0}
.hist b{color:var(--ink);font-weight:600}

/* ---- diagram at bottom ---- */
.diagram{max-width:1240px;margin:0 auto;padding:8px 16px 56px}
.diagram-head{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;color:#555;font-size:13px}
.diagram-head b{font-size:16px;color:#222}
.diagram img{display:block;width:100%;max-width:100%;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
@media (max-width:899px){.diagram{padding:20px 12px 40px;background:var(--bg)}}
.console .who-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.console .who-row{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#c9ced6;line-height:1.45}
.console .who-row .avatar{width:22px;height:22px;font-size:10px;margin-top:1px}
.console .who-row b{color:#fff;font-weight:600}
.carry-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.carry-tiles .tile{background:#FAFAFA;padding:10px 12px}
.carry-tiles .tile .v{font-size:18px}

/* ---- guide (roles + demo route) ---- */
.guide{width:300px;flex:0 0 auto;background:#fff;border-radius:16px;padding:16px 16px 18px;font-size:13px;color:#333;max-height:874px;overflow:auto;scrollbar-width:thin;align-self:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.guide h3{margin:0 0 10px;font-size:14px;color:#111;letter-spacing:.04em}
.guide .grp{border-top:1px solid #EEE;padding-top:12px;margin-top:12px}
.guide .grp:first-child{border-top:0;padding-top:0;margin-top:0}
.guide .grp b.lbl{display:block;font-size:11px;color:#999;letter-spacing:.12em;margin-bottom:8px;font-weight:600}
.role{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed #F0F0F0}
.role:last-child{border-bottom:0}
.role .avatar{width:28px;height:28px;font-size:12px;margin-top:1px}
.role .nm{font-weight:700;color:#111}
.role .tag{font-size:11px;color:#8a6100;background:var(--y-soft);border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:600}
.role .ds{font-size:12px;color:#555;line-height:1.5;margin-top:2px}
.route{position:relative;padding-left:22px}
.route::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:2px;background:#EEE}
.step{position:relative;display:block;width:100%;text-align:left;background:#F7F7F7;border-radius:10px;padding:9px 10px 9px 12px;margin-bottom:10px;line-height:1.4}
.step::before{content:attr(data-n);position:absolute;left:-22px;top:9px;width:18px;height:18px;border-radius:50%;background:var(--y);color:#111;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.step:hover{background:#FFF6D6}
.step .st{font-weight:700;color:#111;font-size:13px}
.step .sd{font-size:12px;color:#666;margin-top:2px}
.step .sw{font-size:11px;color:#999;margin-top:3px}
.step .sw i{font-style:normal;color:#8a6100;font-weight:600}

.sheet.settled,.sheet-mask.settled,.push.settled{animation:none}

</style>
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="screen">
      <div class="island"></div>
      <div class="statusbar"><span class="time" id="clock">9:41</span><span class="right"><span>●●●</span><span>WiFi</span><span>▮</span></span></div>
      <div class="app">
        <div class="content" id="content"></div>
        <div class="tabbar" id="tabbar"></div>
      </div>
      <div id="overlay"></div>
      <div class="homebar"></div>
    </div>
  </div>
  <aside class="console" id="console"></aside>
  <aside class="guide" id="guide"></aside>
  <button class="console-fab" id="consoleFab" title="演示控制台">⚙</button>
</div>

/* ---------- helpers ---------- */
const fmt = n => (Math.round(n*100)/100).toFixed(n%1===0?0:2).replace(/\.00$/,'');
const fmt1 = n => (Math.round(n*100)/100).toFixed(2).replace(/\.?0+$/,'');
const yuan = n => '¥' + fmt1(Math.abs(n));
function member(id){ return S.members.find(m=>m.id===id) || (S.invitee.id===id? S.invitee : null); }
function activeMembers(){ return S.members.filter(m=>!S.left.includes(m.id)); }

function dateCN(d){ return `${parseInt(d.slice(5,7))}月${parseInt(d.slice(8,10))}日`; }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function addDays(d,n){ const t=new Date(d); t.setDate(t.getDate()+n); return t.toISOString().slice(0,10); }

/* ---------- facts ---------- */
function awayDays(mid){
  let d = 0;
  S.facts.away.filter(a=>a.member===mid && a.status==='confirmed').forEach(a=>{
    const from = a.from < MONTH+'-01' ? MONTH+'-01' : a.from;
    const to = a.to > MONTH+'-30' ? MONTH+'-30' : a.to;
    if(to>=from) d += daysBetween(from,to)+1;
  });
  return Math.min(d, MONTH_DAYS);
}
function guestNights(mid){ return (S.facts.guests[mid]||[]).filter(d=>d.startsWith(MONTH)).length; }
function guestHalf(mid){
  const n = guestNights(mid); const r = S.rules.current.q2;
  if(r==='A') return 0; if(r==='C') return n*0.5; return n>=3 ? n*0.5 : 0;
}
function personDays(mid){
  const away = S.rules.current.q1==='A' ? 0 : S.rules.current.q1==='C' ? (awayDays(mid)>10? awayDays(mid):0) : awayDays(mid);
  const w = S.rules.current.q3==='C' ? member(mid).weight : 1;
  return { home: MONTH_DAYS-away, away, guest: guestHalf(mid), w, pd: (MONTH_DAYS-away)*w + guestHalf(mid) };
}
const UTIL = ['电费','水费','燃气费'];
function billMemberIds(b){ return b.members || activeMembers().map(m=>m.id); }
function billMembers(b){ return billMemberIds(b).map(id=>member(id)).filter(Boolean); }

/* ---------- split engine ---------- */
function splitBill(b){
  const ms = billMemberIds(b);
  const n = ms.length;
  const shares = {}; const lines = []; let mode = 'equal';
  if(b.type==='房租'){
    ms.forEach(id=>{ shares[id]=member(id).rent; });
    lines.push({k:'规则', v:'房租按房间定（第 3 题）'});
    ms.forEach(id=> lines.push({k:`${nameOf(id)} · ${member(id).room}`, v: yuan(shares[id])}));
    return { shares, equal:{...shares}, lines, mode:'rule', maxDiff:0, ruleName:'按房间' };
  }
  if(UTIL.includes(b.type)){
    const pds = {}; let total = 0;
    ms.forEach(id=>{ pds[id]=personDays(id); total += pds[id].pd; });
    const per = b.amount/total;
    ms.forEach(id=>{ shares[id] = pds[id].pd*per; });
    lines.push({k:'规则', v:`按人天分摊（第 1、2${S.rules.current.q3==='C'?'、3':''} 题）`});
    lines.push({k:'本月天数', v:`${MONTH_DAYS} 天 · 共 ${fmt1(total)} 人天 · 每人天 ${yuan(per)}`});
    ms.forEach(id=>{
      const p = pds[id]; let d = `在家 ${p.home} 天`;
      if(p.away) d += `，不在家 ${p.away} 天`;
      if(p.guest) d += `，访客 ${guestNights(id)} 晚 × 0.5`;
      if(p.w!==1) d += `，房间权重 ${p.w}`;
      lines.push({k:`${nameOf(id)}：${d}`, v:`${fmt1(p.pd)} 人天 → ${yuan(shares[id])}`});
    });
  } else {
    ms.forEach(id=>{ shares[id] = b.amount/n; });
    const rn = b.kind==='物资' ? '消耗品记账均摊（第 4 题）' : b.type==='保洁' ? '保洁费用均摊（第 6 题）' : '按人头均摊';
    lines.push({k:'规则', v:rn});
    lines.push({k:`${n} 人均摊`, v:`每人 ${yuan(b.amount/n)}`});
  }
  const equal = {}; ms.forEach(id=> equal[id]=b.amount/n);
  let maxDiff = 0; ms.forEach(id=> maxDiff = Math.max(maxDiff, Math.abs(shares[id]-equal[id])));
  mode = maxDiff >= CARRY_LIMIT ? 'rule' : 'equal';
  return { shares, equal, lines, mode, maxDiff, ruleName: UTIL.includes(b.type)?'按人天':'均摊' };
}
/* 本次实际收款额：mode=rule 收规则份额；mode=equal 收均摊，差额滚存 */
function collectShare(b, mid){ const sp = splitBill(b); return sp.mode==='rule' ? sp.shares[mid] : sp.equal[mid]; }
function carryOf(mid){
  let c = 0;
  S.bills.forEach(b=>{ const sp = splitBill(b); if(sp.mode==='equal' && sp.shares[mid]!==undefined) c += sp.shares[mid]-sp.equal[mid]; });
  return c; // 正数 = 按规则本应多付、退租时补；负数 = 退租时退还
}
function carryRule(mid){ let t=0; S.bills.forEach(b=>{ const sp=splitBill(b); if(sp.mode==='equal' && sp.shares[mid]!==undefined) t+=sp.shares[mid]; }); return t; }
function carryEqual(mid){ let t=0; S.bills.forEach(b=>{ const sp=splitBill(b); if(sp.mode==='equal' && sp.equal[mid]!==undefined) t+=sp.equal[mid]; }); return t; }
function owedByMe(mid){ // 我未付
  let t = 0; const items = [];
  S.bills.forEach(b=>{ if(b.payer!==mid && !b.paid[mid] && splitBill(b).shares[mid]!==undefined){ const s = collectShare(b,mid); t += s; items.push({b, s}); } });
  return { total:t, items };
}
function owedToMe(mid){ // 别人欠我
  let t = 0; const items = [];
  S.bills.filter(b=>b.payer===mid).forEach(b=>{ billMembers(b).forEach(m=>{ if(m.id!==mid && !b.paid[m.id]){ const s = collectShare(b,m.id); t += s; items.push({b, who:m.id, s}); } }); });
  return { total:t, items };
}
/* 净额结算：谁给谁转 */
function netTransfers(){
  const bal = {};
  S.bills.forEach(b=>{ billMembers(b).forEach(m=>{ if(m.id!==b.payer && !b.paid[m.id]){ const s = collectShare(b,m.id); bal[m.id]=(bal[m.id]||0)-s; bal[b.payer]=(bal[b.payer]||0)+s; } }); });
  const debt = Object.entries(bal).filter(([,v])=>v<-0.005).map(([id,v])=>({id,v:-v})).sort((a,b)=>b.v-a.v);
  const cred = Object.entries(bal).filter(([,v])=>v>0.005).map(([id,v])=>({id,v})).sort((a,b)=>b.v-a.v);
  const tr = []; let i=0,j=0;
  while(i<debt.length && j<cred.length){ const x = Math.min(debt[i].v, cred[j].v); tr.push({from:debt[i].id,to:cred[j].id,amt:x}); debt[i].v-=x; cred[j].v-=x; if(debt[i].v<0.005) i++; if(cred[j].v<0.005) j++; }
  return tr;
}
/* 退租结算 */
function settlement(mid){
  const m = member(mid);
  const unpaid = owedByMe(mid); const toMe = owedToMe(mid);
  const carry = carryOf(mid);
  const supplyValue = 36; // 公共物品折价（在库消耗品估值）
  const n = activeMembers().length;
  const supplyShare = supplyValue / n;
  const lines = [
    { k:'押金退还', v: m.deposit, note:`${m.room} · 入住 ${dateCN(m.joined||'2026-06-01')}` },
    { k:'未付账单', v: -unpaid.total, note: unpaid.items.map(x=>`${x.b.type} ${yuan(x.s)}`).join('，') || '无' },
    { k:'待收账单', v: toMe.total, note: toMe.items.length? `${toMe.items.length} 笔` : '无' },
    { k:'滚存差额', v: -carry, note: carry>0? '按规则本应多付，一次补齐' : carry<0? '按规则本应少付，一次退还' : '无差额' },
    { k:'公共物品折价', v: supplyShare, note:`在库消耗品估值 ${yuan(supplyValue)} ÷ ${n} 人` },
  ];
  const total = lines.reduce((a,l)=>a+l.v,0);
  return { lines, total };
}
/* 阈值 */
function thresholdGap(){ const v = activeMembers().map(m=>S.chores.thresholds[m.id]).filter(x=>x); return v.length? Math.max(...v)-Math.min(...v) : 0; }
/* 谁买得最多 */
function buyerRanking(){
  const t = {}; S.supplies.forEach(k=> k.buys.forEach(b=>{ t[b.by] = t[b.by]||{n:0,amt:0}; t[b.by].n++; t[b.by].amt+=b.amount; }));
  return Object.entries(t).map(([id,v])=>({id,...v})).sort((a,b)=>b.amt-a.amt);
}

function toggleAway(){
  const my = S.me; const on = !S.facts.awayNow[my]; S.facts.awayNow[my] = on;
  if(on){
    const from = S.today, to = addDays(S.today, 3);
    S.facts.away.push({id:uid(), member:my, from, to, by:my, status:'confirmed'});
    const myAreas = Object.entries(S.chores.rota).filter(([,w])=>w===my).map(([a])=>a);
    if(myAreas.length && !S.chores.swapRequest){ S.chores.swapRequest = { area: myAreas[0], from: my, week: S.chores.weekStart }; }
    logIt(`${nameOf(my)} 标记从今天起不在家`);
    toast('已标记不在家 · 值日已发起换班');
  } else {
    S.facts.away = S.facts.away.filter(a=>!(a.member===my && a.from===S.today));
    if(S.chores.swapRequest && S.chores.swapRequest.from===my) S.chores.swapRequest = null;
    toast('欢迎回来');
  }
  render();
}

function confirmFact(id, ok){
  const p = S.facts.pending.find(x=>x.id===id); if(!p) return;
  S.facts.pending = S.facts.pending.filter(x=>x.id!==id);

  else { logIt(`${nameOf(p.member)} 表示 ${nameOf(p.by)} 的标记有误，已撤销`); toast('已撤销该标记'); }
  render();
}

function billStatus(b, mid){
  if(b.payer===mid){ const others = billMembers(b).filter(m=>m.id!==mid); const unpaid = others.filter(m=>!b.paid[m.id]).length; return unpaid? {t:`待收 ${unpaid} 人`,c:'o'} : {t:'已收齐',c:'g'}; }
  if(!(mid in splitBill(b).shares)) return {t:'不涉及',c:''};
  if(b.paid[mid]) return (b.confirmed||{})[mid] ? {t:'已结',c:'g'} : {t:'待对方确认',c:'b'};
  return S.today > b.due ? {t:'逾期',c:'r'} : {t:'待付',c:'y'};
}

function openAsk(qid){
  askQ = '';
  openSheet(()=>`<h2>入住前想问一下</h2><div class="sub">只会发给发起人老赵一个人，其他人看不到你问了什么。</div>
  <div class="field"><label>关于第 ${QUESTIONS.findIndex(q=>q.id===qid)+1} 题</label><textarea class="input" rows="3" placeholder="比如：垃圾站在哪？拖把放哪？" oninput="askQ=this.value">${askQ}</textarea></div>
  <button class="btn" onclick="sendAsk()">只发给老赵</button>`);
}
function sendAsk(){ if(!askQ.trim()){ toast('写点什么'); return; } S.invitee.question = askQ.trim(); S.invitee.status='asked'; S.invitee.answered=false; logIt('小雅入住前问了老赵一个问题（仅老赵可见）'); closeSheet(); toast('已发给老赵，只有他能看到'); }
function answerAsk(){ S.invitee.answered = true; S.invitee.status = S.invitee.joinedAt? 'joined':'onboarding'; toast('已回复小雅'); logIt('老赵回复了小雅的问题'); render(); }
function finishOnb(){
  const inv = S.invitee;
  const m = { id:inv.id, name:inv.name, short:inv.short, color:inv.color, room:inv.room, rent:inv.rent, deposit:inv.deposit, weight:inv.weight, role:'新室友', joined:S.today };
  // 冻结既有账单的参与人
  S.bills.forEach(b=>{ if(!b.members) b.members = activeMembers().map(x=>x.id); });
  S.members.push(m); inv.status='joined'; inv.joinedAt=S.today;
  S.chores.thresholds[m.id] = onb.threshold;
  // 触发回顾：小雅的答案已作为她的作答
  S.rules.reviewPending = true; S.rules.reviewReason = '小雅入住触发'; S.rules.reviewAnswers = { [m.id]: {...onb.answers} };
  logIt('小雅完成入住流程，已加入；成员变动触发规则回顾');
  onb = null; closeAll(); S.tab='home';
  push('欢迎加入', '你已加入「望京 · 融科橄榄城 3 居」。其他人会重新回答 6 道题，结果出来前沿用现行规则。');
  render();
}

/* ================= REVIEW（规则回顾） ================= */
let rv = null;
function triggerReview(reason){ S.rules.reviewPending = true; S.rules.reviewReason = reason; S.rules.reviewAnswers = S.rules.reviewAnswers && S.rules.reviewPending ? S.rules.reviewAnswers : {}; logIt(`规则回顾：${reason}`); }
function startReview(){ rv = { step:0, answers:{} }; openSheet(sheetReview, true); }
function sheetReview(){
  const q = QUESTIONS[rv.step]; const a = rv.answers[q.id]; const cur = S.rules.current[q.id];
  return `<div class="progress"><i style="width:${(rv.step+1)/6*100}%"></i></div><div class="q-num">规则回顾 · 第 ${rv.step+1} / 6 题</div><div class="q-title">${q.title}</div>
  ${Object.entries(q.opts).map(([k,v])=>`<div class="opt ${a===k?'on':''}" onclick="rv.answers['${q.id}']='${k}';renderOverlay()"><div class="k">${k}</div><div class="col"><span>${v}</span>${k===cur?'<span class="tally">现行</span>':''}${k===q.rec?`<span class="why">推荐 · ${q.why}</span>`:''}</div></div>`).join('')}
  <div class="btn-row">${rv.step>0?`<button class="btn ghost" onclick="rv.step--;renderOverlay()">上一步</button>`:`<button class="btn ghost" onclick="closeAll()">稍后</button>`}<button class="btn" ${a?'':'disabled'} onclick="${rv.step<5?'rv.step++;renderOverlay()':'finishReview()'}">${rv.step<5?'下一题':'提交'}</button></div>
  <div class="t3" style="text-align:center;margin-top:10px">没有人在提议什么，只是各自重新选一次。汇总只显示几人选了什么。</div>`;
}
function finishReview(){
  S.rules.reviewAnswers[S.me] = {...rv.answers}; rv = null; closeAll();
  const ms = activeMembers().map(m=>m.id);
  if(ms.every(id=>S.rules.reviewAnswers[id])){
    const changes = [];
    QUESTIONS.forEach(q=>{ const cnt = {}; ms.forEach(id=>{ const v = S.rules.reviewAnswers[id][q.id]; cnt[v]=(cnt[v]||0)+1; }); const best = Object.entries(cnt).sort((a,b)=>b[1]-a[1]); const top = best[0]; const tie = best[1] && best[1][1]===top[1]; const win = tie ? S.rules.current[q.id] : top[0]; if(win!==S.rules.current[q.id]) changes.push(`第 ${QUESTIONS.indexOf(q)+1} 题 ${S.rules.current[q.id]} → ${win}`); S.rules.current[q.id]=win; S.rules.answers[q.id] = {}; ms.forEach(id=> S.rules.answers[q.id][id]=S.rules.reviewAnswers[id][q.id]); });
    S.rules.version++; S.rules.history.push({v:S.rules.version, date:S.today, note:`${S.rules.reviewReason}，${activeMembers().length} 人重答。${changes.length? changes.join('；') : '规则无变化'}`});
    S.rules.reviewPending=false; S.rules.lastReview=S.today; S.rules.reviewAnswers={};
    logIt(`规则回顾完成 → v${S.rules.version}${changes.length?'：'+changes.join('；'):'，无变化'}`);
    push('规则回顾完成', changes.length? `公约更新为 v${S.rules.version}：${changes.join('；')}` : `${activeMembers().length} 人重答，规则没有变化，公约 v${S.rules.version}`);
  } else { toast('已提交 · 等其他人作答'); }
  render();
}

/* ================= SETTLEMENT（退租） ================= */
function openSettle(mid){ openSheet(()=>sheetSettle(mid)); }
function sheetSettle(mid){
  const m = member(mid); const s = settlement(mid);
  return `<h2>${m.name} 退租结算单</h2><div class="sub">按第 5 题：未结账单、滚存差额、押金份额、公共物品折价，一次算清</div>
  <div class="card"><table class="settle-tbl">${s.lines.map(l=>`<tr><td><div>${l.k}</div><div class="t3">${l.note}</div></td><td class="${l.v<0?'':'money in'}" style="${l.v<0?'color:var(--orange)':''}">${l.v<-0.005?'−':l.v>0.005?'+':''}${yuan(l.v)}</td></tr>`).join('')}<tr class="total"><td>${s.total>=0?'应退给 '+m.name:m.name+' 应补'}</td><td>${yuan(s.total)}</td></tr></table></div>
  <div class="note">确认后：${m.name} 退出账本，值日表重排，剩下的人触发一次规则回顾。既有账单的分摊人不变。</div>
  <div class="btn-row"><button class="btn ghost" onclick="closeSheet()">只是看看</button><button class="btn dark" onclick="confirmSettle('${mid}')">确认退租</button></div>`;
}
function confirmSettle(mid){
  const s = settlement(mid);
  S.bills.forEach(b=>{ if(!b.members) b.members = activeMembers().map(x=>x.id); });
  S.left.push(mid); S.settlements.push({member:mid, date:S.today, total:s.total});
  const rest = activeMembers().map(m=>m.id);
  Object.keys(S.chores.rota).forEach((a,i)=>{ if(S.chores.rota[a]===mid) S.chores.rota[a] = rest[i%rest.length]; });
  if(S.chores.swapRequest && S.chores.swapRequest.from===mid) S.chores.swapRequest=null;
  if(S.supplyBuyer===mid) S.supplyBuyer = rest[0];
  if(S.me===mid) S.me = rest[0];
  triggerReview(`${nameOf(mid)} 退租触发`);
  logIt(`${nameOf(mid)} 办理退租，结算 ${s.total>=0?'退':'补'} ${yuan(s.total)}`);
  closeAll(); toast('已结算 · 剩余成员将重答规则'); S.tab='home'; render();
}

];
function renderGuide(){
  const el = $('#guide'); if(!el) return;
  el.innerHTML = `<div class="grp"><h3>这四个人</h3>${ROLES.map(r=>`<div class="role">${avatarHTML(r.id)}<div><span class="nm">${nameOf(r.id)}</span><span class="tag">${r.tag}</span><div class="ds">${r.desc}</div></div></div>`).join('')}</div>
  <div class="grp"><b class="lbl">推荐演示路线 · 点一步跳一步</b><div class="route">${ROUTE.map((r,i)=>`<button class="step" data-n="${i+1}" onclick="ROUTE[${i}].fn()"><div class="st">${r.t}</div><div class="sd">${r.d}</div><div class="sw">看点：<i>${r.w}</i></div></button>`).join('')}</div></div>`;
}
function renderConsole(){
  const el = $('#console'); if(!el) return;
  const who = [...activeMembers().map(m=>m.id), ...(S.invitee.status!=='none'&&S.invitee.status!=='joined'?['xiaoya']:[])];
  el.innerHTML = `<h3>演示控制台</h3><p class="hint">屏幕外的遥控器。左边是正常 App，这里替"世界"发生事情。</p>
  <div class="grp"><b>当前身份</b><div class="row">${who.map(id=>`<button class="who ${S.me===id?'on':''}" onclick="switchMe('${id}')">${nameOf(id)}</button>`).join('')}</div></div>
  <div class="grp"><b>推送</b><div class="row">
    <button onclick="demoGeo()">定位：大力连续 24h 不在家</button>
    <button onclick="demoBack()">定位：大力回到家附近</button>
    <button onclick="demoDun()">系统催款：阿杰电费逾期</button>
    <button onclick="demoBuyPush()">采购提醒：垃圾袋空了</button>
    <button onclick="demoAyiPush()">保洁上门前一天提醒</button>
  </div></div>
  <div class="grp"><b>事件</b><div class="row">

    <button onclick="nextWeek()">下一周（轮值滚动）</button>

  </div></div>
  <div class="grp"><b>状态</b>
    <div class="kv"><span>今天</span><span>${S.today}</span></div>
    <div class="kv"><span>身份</span><span>${nameOf(S.me)}</span></div>
    <div class="kv"><span>公约</span><span>v${S.rules.version}${S.rules.reviewPending?' · 回顾中':''}</span></div>
    <div class="kv"><span>等确认</span><span>${pendingForMe().length}</span></div>
    <div class="row" style="margin-top:10px"><button class="y" onclick="if(confirm('重置为演示初始数据？')){resetAll();sheets=[];render();}">重置演示数据</button></div>
  </div>`;
}
function demoGeo(){ switchMe('dali'); push('你不在家吗？', '检测到你连续 24 小时不在家附近（仅本机判断，位置不共享）。标记为不在家后：值日自动换班、水电按天算。', [ {label:'不是', fn:()=>toast('好的，不标记')}, {label:'是的，出差了', pri:true, fn:()=>{ if(!S.facts.awayNow.dali){ S.me='dali'; toggleAway(); } }} ]); }
function demoBack(){ switchMe('dali'); push('欢迎回来', '检测到你回到家附近。从今天起按在家算？', [ {label:'还没', fn:()=>{}}, {label:'是的', pri:true, fn:()=>{ if(S.facts.awayNow.dali){ S.me='dali'; toggleAway(); } }} ]); }
function demoDun(){ const b = S.bills.find(x=>x.type==='电费'); if(!b) return; S.today = addDays(b.due, 2); b.paid.ajie=false; switchMe('ajie'); push('电费待支付', `9 月电费你的份额 ${yuan(collectShare(b,'ajie'))}，已过约定日期 2 天。这条提醒由系统发出，老赵没有催。`, [ {label:'稍后', fn:()=>{}}, {label:'查看明细', pri:true, fn:()=>openBill(b.id)} ]); }
function demoBuyPush(){ const k = S.supplies.find(x=>x.name==='垃圾袋'); k.status='empty'; switchMe(S.supplyBuyer); push('垃圾袋空了', `本周采购轮到你。买了在物资页填个金额，自动进账本均摊。`, [ {label:'知道了', fn:()=>{}}, {label:'我买了', pri:true, fn:()=>{ buy={item:'垃圾袋',amount:''}; go('supplies'); openSheet(sheetBuy); }} ]); }
function demoAyiPush(){ if(S.ayi.status==='suggested'||S.ayi.status==='declined'){ S.ayi.status='trial'; S.ayi.trialBy='zhao'; S.ayi.nextDate=addDays(S.today,1); } push('阿姨明天上门', `${dateCN(S.ayi.nextDate)} 10:00 保洁 2 小时。私人物品收进房间，公共区域会全部打扫。费用 ${yuan(S.ayi.price)} 已按 ${activeMembers().length} 人均摊入账。`); render(); }

function demoInvite(){ if(S.invitee.status==='none') inviteNew(); closeAll(); onb=null; switchMe('xiaoya'); }

function ff48(){ const ps = [...S.facts.pending]; ps.forEach(p=>{ S.facts.pending = S.facts.pending.filter(x=>x.id!==p.id); S.facts.away.push({id:uid(), member:p.member, from:p.from, to:p.to, by:p.by, status:'confirmed'}); logIt(`${nameOf(p.member)} 48 小时未反对，${dateCN(p.from)}–${dateCN(p.to)} 不在家自动成立`); }); S.today = addDays(S.today,2); toast(ps.length? `${ps.length} 条待确认已自动成立` : '没有待确认的事'); render(); }
function nextWeek(){ const c = S.chores; const ms = activeMembers().map(m=>m.id); const order = c.areas.map(a=>c.rota[a]); const shifted = c.areas.map((a,i)=> order[(i+order.length-1)%order.length]); c.areas.forEach((a,i)=> c.rota[a]=shifted[i]); c.weekStart = addDays(c.weekStart,7); c.swapRequest=null; S.today = addDays(S.today,7); Object.keys(S.facts.awayNow).forEach(k=>S.facts.awayNow[k]=false); const i = ms.indexOf(S.supplyBuyer); S.supplyBuyer = ms[(i+1)%ms.length]; toast('已到下一周 · 轮值已滚动'); render(); }
function monthEnd(){ switchMe('ajie'); const n = guestNights('ajie'); push('月底对一下', `本月你登记了 ${n} 晚访客，按规则计 ${n*0.5} 人天。确认吗？只有你和系统知道逐晚记录，账单里只出现总数。`, [ {label:'有出入', fn:()=>toast('可以在首页改登记')}, {label:'确认', pri:true, fn:()=>toast('已确认 · 进本月账单')} ]); }
